name: Fix Code Style

on: [push]

jobs: 
  lint:
      runs-on: ubuntu-latest
      strategy:
        fail-fast: true
        matrix:
          php: [8.4]

      steps:
        - name: Checkout mode
          uses: actions/checkout@v5

        - name: Setup PHP
          uses: shivammathur/setup-php@v2
          with:
            php-version: ${{ matrix.php }}
            tools: pint

        - name: Run Pint
          run: pint

        - name: Commit linted files
          uses: stefanweifel/git-auto-commit-action@v6
